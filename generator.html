<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legends Card Generator</title>
  <link rel="stylesheet" href="css/generator.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/backs.css">
</head>

<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">Legends</p>
      <h1 class="hero-title">Gerador de Cards</h1>
      <p class="hero-subtitle">Escolha um modelo, carregue os dados e imprima cada página com nove cartas por folha A4.</p>
    </div>
    <div class="hero-actions">
      <button class="hero-action" onclick="document.getElementById('model-menu').scrollIntoView({ behavior: 'smooth' })">Ver modelos</button>
    </div>
  </header>

  <div class="set-tabs">
    <button class="set-tab active" data-set="official">Jogo Base</button>
    <button class="set-tab" data-set="expansion">Expansões</button>
  </div>

  <div class="menu-wrapper">
    <nav class="generator-menu" data-set="official">
      <button class="menu-button active" data-model="monsters" data-set="official">Cards de monstros</button>
      <button class="menu-button" data-model="heroes" data-set="official">Cards de heróis</button>
      <button class="menu-button" data-model="classes" data-set="official">Cards de classes</button>
      <button class="menu-button" data-model="subclasses" data-set="official">Cards de subclasses</button>
      <button class="menu-button" data-model="backs" data-set="official">Versos dos Cards</button>
    </nav>
    <nav class="generator-menu hidden" data-set="expansion">
      <button class="menu-button" data-model="reinos" data-set="expansion" disabled>Reinos Celestiais</button>
    </nav>
  </div>

  <main class="generator-main">
    <div class="structure-toggle" id="structure-toggle">
      <button id="structure-toggle-button">Estrutura do Deck</button>
      <div class="structure-options" id="structure-options">
        <a href="structure-official.html">Jogo Base</a>
        <a href="structure-reinos.html">Reinos Celestiais</a>
      </div>
    </div>

    <section class="generator-panel">
      <div class="panel-header">
        <div>
          <p class="panel-label">Modelo ativo</p>
          <h2 id="model-title">Monstros</h2>
          <p id="model-description" class="panel-description">Cards de monstros com level, habilidades e troféus.</p>
        </div>
        <div class="panel-actions">
          <button id="preview-button" class="primary-solid">Visualizar impressão</button>
        </div>
      </div>
      <p id="status-message" class="status-message">Selecione um modelo para carregar os cards.</p>
      <div id="pages-container"></div>
    </section>
  </main>

  <script src="js/cards.js"></script>
  <script src="js/backs.js"></script>
  <script src="js/generator.js"></script>
</body>
</html>
